name: Check visualization
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: visualization-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - name: Synthetic browser read-back
        env:
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # Browser tooling is CI-only; generated package/runtime boundaries stay unchanged.
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
          npm run preview -- --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/visualization-preview.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          UI_URL=http://127.0.0.1:4173 node tests/browser-investment.mjs
          UI_URL=http://127.0.0.1:4173 DESIGN_STAGE=after node tests/browser-judgment-design.mjs
          UI_URL=http://127.0.0.1:4173 node tests/browser-checkpoint-reviews.mjs
      - name: Retain synthetic screenshots and read-back
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: investment-hub-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/investment-hub/
            !.artifacts/investment-hub/1440-*.png
            !.artifacts/investment-hub/390-*.png
            !.artifacts/investment-hub/320-*.png
          if-no-files-found: warn
          retention-days: 7

      - name: Retain 1440px full-tab stress screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: investment-hub-1440-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/investment-hub/1440-*.png
          if-no-files-found: warn
          retention-days: 7

      - name: Retain 390px full-tab stress screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: investment-hub-390-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/investment-hub/390-*.png
          if-no-files-found: warn
          retention-days: 7

      - name: Retain 320px full-tab stress screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: investment-hub-320-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/investment-hub/320-*.png
          if-no-files-found: warn
          retention-days: 7

      - name: Retain compact judgment screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: judgment-view-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/investment-hub/judgment-change-1080.png
            .artifacts/investment-hub/judgment-change-390.png
            .artifacts/investment-hub/claim-relations-1080.png
            .artifacts/investment-hub/claim-relations-390.png
            .artifacts/investment-hub/judgment-ready-1080.png
            .artifacts/investment-hub/claim-ready-1080.png
            .artifacts/investment-hub/judgment-ready-1080-full.png
            .artifacts/investment-hub/claim-ready-1080-full.png
            .artifacts/investment-hub/report.json
          if-no-files-found: warn
          retention-days: 7

      - name: Check out unchanged visual baseline
        uses: actions/checkout@v4
        with:
          ref: 60cda8102fd90292278cbde04fd06a9014523b92
          path: .visual-baseline
      - name: Capture matching before screenshots
        run: |
          (cd .visual-baseline && npm ci && npm run build)
          (cd .visual-baseline && npm run preview -- --host 127.0.0.1 --port 4174) > "$RUNNER_TEMP/judgment-baseline.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          SOURCE_REVISION=60cda8102fd90292278cbde04fd06a9014523b92 UI_URL=http://127.0.0.1:4174 DESIGN_STAGE=before node tests/browser-judgment-design.mjs
      - name: Retain normal-content judgment comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: judgment-design-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/judgment-design/
          if-no-files-found: warn
          retention-days: 7

      - name: Retain synthetic checkpoint review read-back
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint-reviews-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/checkpoint-reviews/
          if-no-files-found: warn
          retention-days: 7
