name: Check visualization
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: visualization-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - name: Synthetic browser read-back
        run: |
          # Browser tooling is CI-only; generated package/runtime boundaries stay unchanged.
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
          npm run preview -- --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/visualization-preview.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright'
          import assert from 'node:assert/strict'
          import { mkdir, writeFile } from 'node:fs/promises'
          const origin = 'http://127.0.0.1:4173'
          for (let attempt = 0; attempt < 40; attempt++) {
            try { if ((await fetch(origin)).ok) break } catch {}
            if (attempt === 39) throw new Error('Preview did not start')
            await new Promise(resolve => setTimeout(resolve, 250))
          }
          const output = '.artifacts/investment-hub'
          await mkdir(output, { recursive: true })
          const browser = await chromium.launch()
          const report = { revision: process.env.GITHUB_SHA, browser: browser.version(), mode: 'synthetic-only', pages: [], scenarios: [] }
          const layoutOf = page => page.evaluate(() => ({
            viewport: document.documentElement.clientWidth,
            scrollWidth: document.documentElement.scrollWidth,
            headings: Array.from(document.querySelectorAll('h1,h2,h3')).filter(el => el.getClientRects().length).map(el => el.textContent)
          }))
          async function noOverflow(page, label) {
            const layout = await layoutOf(page)
            assert(layout.scrollWidth <= layout.viewport + 1, `${label}: document must not scroll horizontally (${layout.scrollWidth}/${layout.viewport})`)
            return layout
          }
          try {
            for (const [name, width, height] of [['desktop', 1440, 1000], ['mobile', 390, 844], ['small', 320, 740]]) {
              const page = await browser.newPage({ viewport: { width, height } })
              const errors = []
              const externalRequests = []
              page.on('pageerror', error => errors.push(error.message))
              page.on('request', request => { if (!request.url().startsWith(origin)) externalRequests.push(request.url()) })
              await page.goto(`${origin}/?tab=investment`, { waitUntil: 'networkidle' })
              await page.getByText('今天發生了什麼', { exact: true }).waitFor()
              assert(await page.getByText(/^最新盤中觀察/).isVisible())
              assert.equal(await page.locator('[aria-label="今天發生了什麼"] article').count(), 1,
                `${name}: matching brief event and update must share one story card`)
              assert(await page.getByRole('heading', { name: /盤中價格反應確認早盤事件/ }).isVisible(),
                `${name}: latest update must be the story heading`)
              assert(await page.getByText('星島設備發表新一代儲能產品（虛構）', { exact: true }).isVisible(),
                `${name}: formal brief baseline must remain visible in the story card`)
              const thesisTab = page.getByRole('tab', { name: '我的論點', exact: true })
              await thesisTab.click()
              assert.equal(await thesisTab.getAttribute('aria-selected'), 'true')
              await page.getByText('來源關聯不一致', { exact: true }).waitFor({ timeout: 5000 })
              const thesisStatus = page.getByRole('region', { name: '論點近況' })
              assert(await thesisStatus.getByRole('heading', { name: '今天的論點變化', exact: true }).isVisible(),
                `${name}: daily judgment changes must be grouped in the thesis status view`)
              assert(await thesisStatus.getByRole('heading', { name: '持續觀察的風險', exact: true }).isVisible(),
                `${name}: continuing risks must appear beside daily changes as a separate subgroup`)
              assert(await thesisStatus.getByText('展示案例尚無交付證據', { exact: true }).isVisible())
              const thesis = page.getByRole('region', { name: '我的論點｜五層證據' })
              assert(await thesis.getByText('來源關聯不一致', { exact: true }).isVisible(),
                `${name}: narrative aggregate drift must remain visible`)
              assert(await thesis.getByText(/合成狀態示例：論點來源關聯互相衝突/).isVisible(),
                `${name}: aggregate state reason must be visible without expanding sources`)
              assert(await thesis.getByText('證據覆蓋：資料部分可用', { exact: true }).isVisible(),
                `${name}: evidence coverage must remain distinct from aggregate narrative state`)
              assert(await thesis.getByText(/合成測試：證據尚未映射到五層/).isVisible())
              const challengeSourceDisclosure = thesis.getByText('訊號日期與來源', { exact: true }).first()
              const challengeSignal = challengeSourceDisclosure.locator('xpath=ancestor::li[1]')
              await challengeSourceDisclosure.click()
              assert(await challengeSignal.getByText(/訊號日期：\s*未提供/).isVisible(),
                `${name}: an unknown signal date must stay unknown`)
              assert(await challengeSignal.getByText(/文件更新日：\s*2026-09-19/).isVisible(),
                `${name}: document update must be separately labelled`)
              assert(await challengeSignal.getByText(/demo\/synthetic-challenge-signal\.md.*第 15 行/).isVisible(),
                `${name}: challenge signal must retain its own source line`)
              await challengeSourceDisclosure.click()
              const historyLink = thesis.getByRole('button', { name: '舊判斷回看', exact: true })
              await historyLink.click()
              assert.equal(await page.getByRole('tab', { name: '舊判斷回看', exact: true }).getAttribute('aria-selected'), 'true')
              await page.getByRole('heading', { name: '回看舊判斷與後續結果', exact: true }).waitFor()
              assert(await page.getByRole('heading', { name: '回看舊判斷與後續結果', exact: true }).isVisible())
              await page.getByRole('tab', { name: '今日', exact: true }).click()
              const marketCard = page.locator('[aria-label="現在盤面與市場資金"]')
              assert.equal(await marketCard.count(), 1, `${name}: context and discovery must share one market card`)
              assert(await page.getByRole('heading', { name: '市場現在怎麼走', exact: true }).isVisible())
              assert.equal(await page.getByRole('heading', { name: '市場資金在哪', exact: true }).count(), 1)
              const twMarket = page.getByRole('tab', { name: '台股', exact: true })
              const usMarket = page.getByRole('tab', { name: '美股', exact: true })
              assert.equal(await twMarket.getAttribute('aria-selected'), 'true')
              const taiwanPulse = page.locator('[aria-label="台股整體盤感"]')
              assert(await taiwanPulse.getByText(/資料交易日 .*本頁讀取於 .*產出於/).isVisible(),
                `${name}: market date, local page read, and producer time must be separate`)
              assert(await taiwanPulse.getByText('漲跌方向待核對', { exact: true }).isVisible(),
                `${name}: unverified direction must have a neutral explicit state`)
              assert(!(await taiwanPulse.innerText()).includes('漲跌 120 點（+0.55%）'),
                `${name}: unverified index changes must not be presented as a directional conclusion`)
              const pulseIntegrityDetails = taiwanPulse.locator('details')
              const pulseIntegrityDisclosure = taiwanPulse.locator('details > summary')
              await pulseIntegrityDisclosure.focus()
              await page.keyboard.press('Space')
              assert(await taiwanPulse.getByText(/TWSE 日結原值：21,880 點；漲跌 120 點/).isVisible(),
                `${name}: source-specific TWSE value must remain inspectable`)
              assert(await taiwanPulse.getByText(/盤後量價原值：21,880 點；漲跌 -120 點/).isVisible(),
                `${name}: conflicting source-specific value must remain inspectable`)
              await page.keyboard.press('Space')
              assert.equal(await pulseIntegrityDetails.getAttribute('open'), null,
                `${name}: disclosure must collapse by keyboard`)
              assert(await page.getByText(/報價時間/).first().isVisible())
              await usMarket.click()
              assert.equal(await usMarket.getAttribute('aria-selected'), 'true')
              assert(await page.getByText(/美股 breadth、成交額與 sector／theme 摘要未提供/).isVisible())
              assert(await page.getByText('目前部分掃描沒有可列標的；不能據此判定整個市場都沒有符合項目。', { exact: true }).isVisible())
              await noOverflow(page, `${name}/US market`)
              await twMarket.focus()
              await page.keyboard.press('ArrowRight')
              assert.equal(await usMarket.getAttribute('aria-selected'), 'true')
              await page.keyboard.press('Home')
              assert.equal(await twMarket.getAttribute('aria-selected'), 'true')
              await noOverflow(page, `${name}/market keyboard`)
              const hero = await page.getByText('今天發生了什麼', { exact: true }).boundingBox()
              assert(hero && hero.y + hero.height < height, `${name}: key judgment must begin in first screen`)
              await page.screenshot({ path: `${output}/${name}.png`, fullPage: true })
              await page.screenshot({ path: `${output}/${name}-first-screen.png` })
              const layout = await noOverflow(page, name)
              for (const label of ['我的論點', '正在研究', '近期要留意', '舊判斷回看', '今日']) {
                const tab = page.getByRole('tab', { name: label, exact: true })
                await tab.click()
                assert.equal(await tab.getAttribute('aria-selected'), 'true')
                await noOverflow(page, `${name}/${label}`)
              }
              const today = page.getByRole('tab', { name: '今日', exact: true })
              await today.focus()
              await page.keyboard.press('ArrowRight')
              assert.equal(await page.getByRole('tab', { name: '我的論點', exact: true }).getAttribute('aria-selected'), 'true')
              await page.keyboard.press('ArrowRight')
              assert.equal(await page.getByRole('tab', { name: '正在研究', exact: true }).getAttribute('aria-selected'), 'true')
              await page.keyboard.press('End')
              assert.equal(await page.getByRole('tab', { name: '舊判斷回看', exact: true }).getAttribute('aria-selected'), 'true')
              await page.keyboard.press('Home')
              assert.equal(await today.getAttribute('aria-selected'), 'true')
              await page.locator('details').evaluateAll(elements => elements.forEach(el => { if (el.getClientRects().length) el.open = true }))
              await page.getByText('此文字由私人端的情境規格重新生成', { exact: false }).waitFor()
              await page.screenshot({ path: `${output}/${name}-expanded.png`, fullPage: true })
              await noOverflow(page, `${name}/expanded`)
              report.pages.push({ name, ...layout, errors, externalRequests, keyboard: 'passed', sourceDisclosure: 'passed' })
              assert.deepEqual(errors, [], `${name}: no browser runtime errors`)
              assert.deepEqual(externalRequests, [], `${name}: demo must remain network-isolated`)
              await page.close()
            }
            // Modify only in-memory synthetic Responses. Do not rewrite generated fixtures,
            // introduce test routes into production, or use any private source material.
            for (const scenario of ['unlinked-long', 'blank-summary', 'missing', 'actions-partial', 'research-only', 'initial-error', 'refresh-error', 'quote-unavailable', 'narrative-stale-partial', 'narrative-delayed', 'market-empty', 'market-unavailable', 'market-cached-unavailable', 'market-initial-error', 'market-refresh-error', 'market-refresh-delayed', 'market-refresh-unavailable', 'market-mixed-dates', 'market-known-breadth-no-ratio']) {
              const page = await browser.newPage({ viewport: { width: 320, height: 740 } })
              const errors = []
              page.on('pageerror', error => errors.push(error.message))
              await page.addInitScript(scenario => {
                const original = Response.prototype.json
                Response.prototype.json = async function () {
                  const data = await original.call(this)
                  if (scenario === 'narrative-stale-partial' && data?.narratives?.[0]?.thesis_evidence) {
                    data.narratives[0].state = 'stale'
                    data.narratives[0].state_reason = '合成測試：論點來源較舊；僅示範 aggregate 狀態。'
                    data.narratives[0].thesis_evidence.state = 'partial'
                    data.narratives[0].thesis_evidence.reason = '合成測試：五層證據覆蓋仍不完整。'
                  }
                  if (scenario === 'narrative-delayed' && Array.isArray(data?.narratives)) await new Promise(resolve => setTimeout(resolve, 600))
                  if (data?.brief) {
                    if (scenario === 'initial-error' || window.__failBrief) throw new Error('Synthetic read failure')
                    if (scenario === 'blank-summary') {
                      data.today.updates[0].summary = '   '
                      data.today.updates[0].portfolio_impact = '更正為 2%，原判斷需下修。'
                    }
                    if (scenario === 'unlinked-long') {
                      data.brief.state = 'stale'
                      data.brief.source_cutoff = null
                      data.brief.headline = '合成長標題：' + 'LongUnbrokenEvidence'.repeat(18)
                      data.brief.thesis_changes = [
                        { thesis: '合成未關聯判斷', event_index: null, event_ref: '', change: '轉弱', reason: '缺少新證據，並非維持不變。' },
                        { thesis: '合成越界判斷', event_index: 999, event_ref: '', change: '待驗證', reason: '應保留內容，不猜測新聞關聯。' }
                      ]
                      data.brief.risks = [{ risk: '合成缺少關聯的風險', status: '仍待確認', event_ref: '' }]
                      data.brief.actions = ['觀察 5%', '觀察 5%', '觀察 6%', '不加碼', '加碼']
                      data.brief.action_items = []
                    }
                    if (scenario === 'missing') {
                      data.brief.state = 'missing'
                      data.brief.headline = ''
                      data.brief.source = null
                      data.brief.action_items = []
                      data.brief.envelope = null
                      data.today = { state: 'unavailable', decision_summary: null, updates: [], limitations: [] }
                      for (const key of ['actions', 'events', 'event_notes', 'thesis_changes', 'thesis_notes', 'risks', 'risk_notes', 'upcoming', 'upcoming_notes', 'market_pulse', 'market_pulse_notes']) data.brief[key] = []
                    }
                    if (scenario === 'actions-partial') {
                      data.brief.state = 'current'
                      data.brief.actions = []
                      data.brief.action_items = []
                      data.brief.source = null
                      data.brief.envelope = { ...data.brief.envelope, completeness: 'partial', limitations: [] }
                      data.today = { state: 'ready', decision_summary: null, updates: [], limitations: [] }
                    }
                    if (scenario === 'research-only') {
                      data.brief.state = 'current'
                      data.brief.actions = []
                      data.brief.action_items = [{ id: 'synthetic-research-only', text: '補研究：核對合成公開資料', status: 'open', tickers: [], evidence: [], artifact_id: 'synthetic-brief', source: 'daily-brief', date: '2026-09-24' }]
                      data.brief.source = null
                      data.brief.envelope = { ...data.brief.envelope, completeness: 'ready', limitations: [] }
                      data.today = { state: 'ready', decision_summary: null, updates: [], limitations: [] }
                    }
                  }
                  if (Array.isArray(data?.markets)) {
                    if (scenario === 'market-initial-error' || (scenario === 'market-refresh-error' && window.__failMarketExplore)) throw new Error('Synthetic market explore failure')
                    if (scenario === 'market-refresh-delayed' && window.__delayMarketExplore) await new Promise(resolve => setTimeout(resolve, 600))
                    if (scenario === 'market-refresh-unavailable' && window.__marketUnavailable) {
                      data.state = 'partial'
                      const tw = data.markets.find(market => market.market === 'tw')
                      tw.state = 'unavailable'
                      for (const bucket of tw.buckets) bucket.items = []
                      const us = data.markets.find(market => market.market === 'us')
                      us.state = 'ready'
                      us.buckets[0].items = [{ symbol: 'SYNTH-US-CONTEXT', label: '合成美股探索甲', price: 123, change_1d_pct: 1, change_7d_pct: 2, activity: { label: 'relative_volume', value: 1.2 }, rsi14: null, vs_50ma_pct: null, rs_benchmark_1m_pp: null, rs_benchmark_window: null, researched: false }]
                    }
                    if (scenario === 'market-cached-unavailable') {
                      data.state = 'unavailable'
                      const clearCachedSnapshot = Boolean(window.__clearMarketCache)
                      data.cached = !clearCachedSnapshot
                      data.message = 'Synthetic market snapshot is cached'
                      const tw = data.markets.find(market => market.market === 'tw')
                      tw.as_of = '2001-02-03'
                      tw.source_cutoff = '2001-02-03T13:30:00+08:00'
                      if (clearCachedSnapshot) {
                        tw.state = 'unavailable'
                        for (const bucket of tw.buckets) bucket.items = []
                      }
                      const us = data.markets.find(market => market.market === 'us')
                      us.state = 'unavailable'
                      for (const bucket of us.buckets) bucket.items = []
                    }
                    if (scenario === 'market-empty') {
                      data.state = 'ready'
                      data.cached = false
                      for (const market of data.markets) {
                        market.state = 'ready'
                        for (const bucket of market.buckets) bucket.items = []
                      }
                    }
                    if (scenario === 'market-unavailable') {
                      data.state = 'unavailable'
                      data.cached = false
                      data.message = ''
                      for (const market of data.markets) {
                        market.state = 'unavailable'
                        for (const bucket of market.buckets) bucket.items = []
                      }
                    }
                    if (scenario === 'market-mixed-dates') {
                      const tw = data.markets.find(market => market.market === 'tw')
                      tw.as_of = '2001-02-03'
                      tw.source_cutoff = '2001-02-03T13:30:00+08:00'
                    }
                  }
                  if (scenario === 'market-mixed-dates' && data?.index && data?.breadth) {
                    data.as_of = '2001-01-02'
                    data.requested_date = '2001-01-03'
                    data.source_dates = { twse: '2001-01-02', tpex: '2001-01-03' }
                    data.generated_at = '2001-03-04T12:00:00+08:00'
                    data.source_cutoff = '2001-01-02T13:30:00+08:00'
                  }
                  if (scenario === 'market-known-breadth-no-ratio' && data?.index && data?.breadth) {
                    data.state = 'partial'
                    data.breadth.advancer_ratio = null
                    data.breadth.combined.up = 7
                    data.breadth.combined.down = 5
                    data.breadth.combined.flat = 2
                  }
                  if (scenario === 'market-mixed-dates' && Array.isArray(data?.items) && data.items.some(item => item && item.market)) {
                    const tw = data.items.find(item => item.market === 'tw')
                    tw.quoted_at = '2001-05-06T09:30:00+08:00'
                  }
                  if (scenario === 'quote-unavailable' && Array.isArray(data?.items) && data.items.some(item => item && 'quoted_at' in item)) {
                    const item = data.items.find(item => item && 'quoted_at' in item)
                    item.state = 'unavailable'
                    item.value = null
                    item.change = null
                    item.change_percent = null
                    item.quoted_at = null
                  }
                  return data
                }
              }, scenario)
              await page.goto(`${origin}/?tab=investment`, { waitUntil: 'networkidle' })
              if (scenario === 'unlinked-long') {
                await page.getByText('其他判斷變化', { exact: true }).click()
                const todayPanel = page.locator('#investment-panel-today')
                for (const text of ['合成未關聯判斷', '合成越界判斷', '合成缺少關聯的風險']) {
                  const item = todayPanel.getByText(text, { exact: true })
                  assert.equal(await item.count(), 1)
                  assert(await item.isVisible())
                }
                assert.equal(await page.getByText('觀察 5%', { exact: true }).count(), 1)
                assert(await page.getByText('收盤前再看一次量能是否延續，不因單一盤中波動追價。', { exact: true }).isVisible())
                assert(await page.getByText('今天怎麼做', { exact: true }).isVisible())
                assert(await page.getByText(/正式簡報截至 未提供/).isVisible())
                const overflowAction = page.getByText('加碼', { exact: true })
                assert.equal(await overflowAction.count(), 1)
                assert.equal(await overflowAction.isVisible(), false, 'overflow actions remain reachable without crowding the first screen')
                await page.getByText('另有 3 項行動', { exact: true }).click()
                assert(await overflowAction.isVisible(), 'expanding the overflow list must reveal every remaining action')
                assert.equal(await page.getByText('尚未結束的行動', { exact: true }).count(), 0)
                assert.equal(await page.getByText('繼續研究', { exact: true }).count(), 0)
              }
              if (scenario === 'blank-summary') {
                assert(await page.getByRole('heading', { name: '最新摘要未提供', exact: true }).isVisible())
                assert(await page.getByText(/對判斷的影響：更正為 2%，原判斷需下修。/).isVisible())
                assert(await page.getByText('正式簡報基線', { exact: true }).isVisible())
                assert(await page.getByText('星島設備發表新一代儲能產品（虛構）', { exact: true }).isVisible())
              }
              if (scenario === 'missing') {
                assert(await page.getByText('尚未取得可讀的今日變化。', { exact: true }).isVisible())
                assert(await page.getByText('今天怎麼做', { exact: true }).isVisible())
                await page.getByRole('tab', { name: '我的論點', exact: true }).click()
                const thesisStatus = page.getByRole('region', { name: '論點近況' })
                assert(await thesisStatus.getByText('簡報來源尚未取得，無法確認是否有論點變化或風險。', { exact: true }).isVisible())
                assert(await thesisStatus.getByText('目前沒有可讀的論點變化；請先確認簡報來源完整。', { exact: true }).isVisible())
                assert(await thesisStatus.getByText('目前沒有可讀的風險註記；請先確認簡報來源完整。', { exact: true }).isVisible())
                assert.equal(await thesisStatus.getByText('已確認完整的簡報沒有列出論點變化。', { exact: true }).count(), 0)
              }
              if (scenario === 'actions-partial') {
                const todayPanel = page.locator('#investment-panel-today')
                assert(await todayPanel.getByRole('status').filter({ hasText: '今日簡報資料不完整' }).isVisible())
                assert(await todayPanel.getByText('目前未讀到可確認的立即行動。', { exact: true }).isVisible())
                assert.equal(await todayPanel.getByText('已確認本版簡報與今日更新沒有列出下一步行動。', { exact: true }).count(), 0)
              }
              if (scenario === 'research-only') {
                const todayPanel = page.locator('#investment-panel-today')
                assert(await todayPanel.getByText('已確認沒有列出立即行動；另有 1 項補研究，請展開查看。', { exact: true }).isVisible())
                const researchSummary = todayPanel.getByText('補研究項目 · 1 項', { exact: true })
                const researchItem = todayPanel.getByText('核對合成公開資料', { exact: true })
                assert.equal(await researchItem.count(), 1)
                assert.equal(await researchItem.isVisible(), false)
                await researchSummary.click()
                assert(await researchItem.isVisible())
                await todayPanel.getByText('查看來源', { exact: true }).click()
                assert(await todayPanel.getByText('來源：daily-brief', { exact: true }).isVisible())
              }
              if (scenario === 'initial-error') {
                await page.getByRole('alert').filter({ hasText: '簡報讀取失敗' }).waitFor()
                assert.equal(await page.getByText('今天要追', { exact: true }).count(), 0)
              }
              if (scenario === 'refresh-error') {
                await page.getByRole('tab', { name: '我的論點', exact: true }).click()
                await page.getByText('今天的論點變化', { exact: true }).waitFor({ timeout: 5000 })
                await page.evaluate(() => { window.__failBrief = true })
                await page.getByRole('button', { name: '更新資料', exact: true }).click()
                const thesisPanel = page.locator('#investment-panel-thesis')
                await thesisPanel.getByRole('alert').filter({ hasText: '目前保留上次讀取的資料' }).waitFor({ timeout: 5000 })
                assert(await thesisPanel.getByText('交付能力是否足以支撐需求', { exact: true }).isVisible())
                assert(await thesisPanel.getByRole('region', { name: '持續觀察的風險' }).getByText('觀察', { exact: true }).isVisible())
              }
              if (scenario === 'quote-unavailable') {
                await page.getByText('未取得', { exact: true }).first().waitFor()
                assert(await page.getByText('未取得', { exact: true }).first().isVisible())
              }
              if (scenario === 'narrative-stale-partial') {
                await page.getByRole('tab', { name: '我的論點', exact: true }).click()
                await page.getByText('來源較舊', { exact: true }).waitFor({ timeout: 5000 })
                const thesis = page.getByRole('region', { name: '我的論點｜五層證據' })
                assert(await thesis.getByText('來源較舊', { exact: true }).isVisible())
                assert(await thesis.getByText('合成測試：論點來源較舊；僅示範 aggregate 狀態。', { exact: true }).isVisible())
                assert(await thesis.getByText('證據覆蓋：資料部分可用', { exact: true }).isVisible())
                assert(await thesis.getByText('合成測試：五層證據覆蓋仍不完整。', { exact: true }).isVisible())
              }
              if (scenario === 'narrative-delayed') {
                const thesisTab = page.getByRole('tab', { name: '我的論點', exact: true })
                await thesisTab.click()
                assert.equal(await thesisTab.getAttribute('aria-selected'), 'true')
                const thesis = page.getByRole('region', { name: '我的論點｜五層證據' })
                await thesis.getByRole('status').filter({ hasText: '正在讀取論點來源' }).waitFor({ timeout: 5000 })
                await thesis.getByText('來源關聯不一致', { exact: true }).waitFor({ timeout: 5000 })
                assert(await thesis.getByText('證據覆蓋：資料部分可用', { exact: true }).isVisible())
              }
              if (scenario === 'market-empty') {
                assert(await page.getByText('本次完整掃描沒有符合條件的標的。', { exact: true }).isVisible())
                assert.equal(await page.getByText('本次掃描沒有標的通過這個分類。', { exact: true }).count(), 3,
                  'complete-empty scan must keep all three empty discovery buckets visible')
              }
              if (scenario === 'market-unavailable') {
                assert(await page.getByText('台股探索資料目前無法取得；不代表沒有符合標的。', { exact: true }).isVisible())
              }
              if (scenario === 'market-cached-unavailable') {
                assert(await page.getByText('目前無法取得新的台股探索結果；以下是先前快照。', { exact: true }).isVisible())
                assert(await page.getByText('島嶼設備甲', { exact: true }).isVisible(), 'initial cached-unavailable response must retain its producer-supplied candidate')
                assert(await page.getByText('先前快照', { exact: true }).isVisible(), 'producer-supplied cached data must be labelled as prior')
                const priorDate = await page.getByText(/資料日 2001-02-03 · 來源截止/).innerText()
                await page.evaluate(() => { window.__clearMarketCache = true })
                await page.getByRole('button', { name: '更新市場資料', exact: true }).click()
                await page.getByText('目前無法取得新的台股探索結果；以下是先前快照。', { exact: true }).waitFor()
                assert(await page.getByText('島嶼設備甲', { exact: true }).isVisible(), 'an unavailable response without a cached payload must retain the previously shown candidates')
                assert(await page.getByText(priorDate, { exact: true }).isVisible(), 'fallback must keep the original producer dates across refreshes')
                await page.getByRole('button', { name: '更新市場資料', exact: true }).waitFor()
              }
              if (scenario === 'market-initial-error') {
                await page.getByRole('alert').filter({ hasText: '市場探索這次無法取得' }).waitFor()
                assert(await page.getByText('市場探索這次無法取得；目前無法判定是否有符合標的。', { exact: true }).isVisible())
              }
              if (scenario === 'market-refresh-error') {
                await page.evaluate(() => { window.__failMarketExplore = true })
                await page.getByRole('button', { name: '更新市場資料', exact: true }).click()
                await page.getByRole('alert').filter({ hasText: '市場探索更新失敗' }).waitFor()
                assert(await page.getByText('島嶼設備甲', { exact: true }).isVisible(), 'refresh failure must keep cached market candidates visible')
                await page.getByRole('button', { name: '更新市場資料', exact: true }).waitFor()
              }
              if (scenario === 'market-refresh-delayed') {
                await page.evaluate(() => { window.__delayMarketExplore = true })
                await page.getByRole('button', { name: '更新市場資料', exact: true }).click()
                assert(await page.getByText('合成台股指數', { exact: true }).isVisible(), 'slow discovery must not hide readable market context')
                assert(await page.getByText('島嶼設備甲', { exact: true }).isVisible(), 'slow discovery must keep existing candidates visible')
                await page.getByRole('button', { name: '更新市場資料', exact: true }).waitFor()
              }
              if (scenario === 'market-refresh-unavailable') {
                await page.getByText('島嶼設備甲', { exact: true }).waitFor()
                const priorDate = await page.getByText(/資料日 .* · 來源截止/).innerText()
                await page.evaluate(() => { window.__marketUnavailable = true })
                await page.getByRole('button', { name: '更新市場資料', exact: true }).click()
                await page.getByText('目前無法取得新的台股探索結果；以下是先前快照。', { exact: true }).waitFor()
                assert(await page.getByText('島嶼設備甲', { exact: true }).isVisible(), 'unavailable refresh must retain last usable Taiwan candidates')
                assert(await page.getByText(priorDate, { exact: true }).isVisible(), 'fallback snapshot must retain its original date')
                await page.getByRole('tab', { name: '美股', exact: true }).click()
                assert(await page.getByText('合成美股探索甲', { exact: true }).isVisible(), 'successful US refresh must remain visible beside unavailable Taiwan data')
                assert.equal(await page.getByText('目前無法取得新的美股探索結果；以下是先前快照。', { exact: true }).count(), 0)
                await page.getByRole('button', { name: '更新市場資料', exact: true }).waitFor()
              }
              if (scenario === 'market-mixed-dates') {
                assert(await page.getByText(/資料交易日 2001-01-02 · 要求日期 2001-01-03 · 本頁讀取於 .* · 產出於 2001\/03\/04 12:00 台北/).isVisible())
                assert(await page.getByText('各來源行情日：TWSE 2001-01-02 · TPEx 2001-01-03', { exact: true }).isVisible())
                assert(await page.getByText(/報價時間 2001\/05\/06 09:30/).isVisible())
                assert(await page.getByText(/資料日 2001-02-03 · 來源截止/).isVisible())
              }
              if (scenario === 'market-known-breadth-no-ratio') {
                const counts = page.getByLabel('台股漲跌家數')
                assert(await counts.getByText('上漲家數', { exact: true }).isVisible())
                assert(await counts.getByText('7', { exact: true }).isVisible())
                assert(await counts.getByText('下跌家數', { exact: true }).isVisible())
                assert(await counts.getByText('5', { exact: true }).isVisible())
                assert(await counts.getByText('平盤家數', { exact: true }).isVisible())
                assert(await counts.getByText('2', { exact: true }).isVisible())
                assert(await page.getByText('漲方比例', { exact: true }).isVisible())
              }
              await page.screenshot({ path: `${output}/${scenario}.png`, fullPage: true })
              const layout = await noOverflow(page, scenario)
              report.scenarios.push({ name: scenario, ...layout, errors })
              assert.deepEqual(errors, [], `${scenario}: no browser runtime errors`)
              await page.close()
            }
          } finally {
            await writeFile(`${output}/report.json`, JSON.stringify(report, null, 2))
            await browser.close()
          }
          NODE
      - name: Retain synthetic screenshots and read-back
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: investment-hub-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/investment-hub/
          if-no-files-found: warn
          retention-days: 7
