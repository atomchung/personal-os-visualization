name: Check visualization
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: visualization-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - name: Synthetic browser read-back
        run: |
          # Browser tooling is CI-only; generated package/runtime boundaries stay unchanged.
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
          npm run preview -- --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/visualization-preview.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright'
          import assert from 'node:assert/strict'
          import { mkdir, writeFile } from 'node:fs/promises'
          const origin = 'http://127.0.0.1:4173'
          for (let attempt = 0; attempt < 40; attempt++) {
            try { if ((await fetch(origin)).ok) break } catch {}
            if (attempt === 39) throw new Error('Preview did not start')
            await new Promise(resolve => setTimeout(resolve, 250))
          }
          const output = '.artifacts/investment-hub'
          await mkdir(output, { recursive: true })
          const browser = await chromium.launch()
          const report = { revision: process.env.GITHUB_SHA, browser: browser.version(), mode: 'synthetic-only', pages: [], scenarios: [] }
          const layoutOf = page => page.evaluate(() => ({
            viewport: document.documentElement.clientWidth,
            scrollWidth: document.documentElement.scrollWidth,
            headings: Array.from(document.querySelectorAll('h1,h2,h3')).filter(el => el.getClientRects().length).map(el => el.textContent)
          }))
          async function noOverflow(page, label) {
            const layout = await layoutOf(page)
            assert(layout.scrollWidth <= layout.viewport + 1, `${label}: document must not scroll horizontally (${layout.scrollWidth}/${layout.viewport})`)
            return layout
          }
          try {
            for (const [name, width, height] of [['desktop', 1440, 1000], ['mobile', 390, 844], ['small', 320, 740]]) {
              const page = await browser.newPage({ viewport: { width, height } })
              const errors = []
              const externalRequests = []
              page.on('pageerror', error => errors.push(error.message))
              page.on('request', request => { if (!request.url().startsWith(origin)) externalRequests.push(request.url()) })
              await page.goto(`${origin}/?tab=investment`, { waitUntil: 'networkidle' })
              await page.getByText('今天發生了什麼', { exact: true }).waitFor()
              assert.equal(await page.locator('[aria-label="今日個人提醒"]').count(), 0, `${name}: Today has no personal reminder projection`)
              assert.equal(await page.getByText('尚未新增個人提醒。', { exact: true }).count(), 0)
              const briefSessions = page.getByRole('region', { name: '簡報版本' })
              assert(await briefSessions.getByText('2026-09-20 · 美股盤前注意 · 正式版', { exact: true }).isVisible())
              assert(await briefSessions.getByText(/資訊截至 2026\/09\/20 21:15 台北/).isVisible())
              const sessionDetails = briefSessions.locator('details')
              assert.equal(await sessionDetails.getAttribute('open'), null, `${name}: target and generation clocks are secondary`)
              await sessionDetails.locator('summary').click()
              assert.match(await sessionDetails.locator('li').nth(0).innerText(), /台股盤前注意.*目標 08:00 台北.*本次資料未提供此班次/)
              assert.match(await sessionDetails.locator('li').nth(1).innerText(), /美股盤前注意.*目標 21:15 台北.*本次所選簡報/)
              assert(await sessionDetails.getByText(/實際產出：2026\/09\/20 21:30 台北/).isVisible())
              await sessionDetails.locator('summary').click()
              assert(await page.getByText('更新於 2026/09/21 00:27 台北', { exact: true }).isVisible(), `${name}: cross-midnight update keeps its observation date once`)
              assert.equal(await page.locator('[aria-label="今天發生了什麼"] article').count(), 1,
                `${name}: matching brief event and update must share one story card`)
              assert(await page.getByRole('heading', { name: /隔夜價格反應確認前一版事件/ }).isVisible(),
                `${name}: latest update must be the story heading`)
              const story = page.locator('[aria-label="今天發生了什麼"] article')
              assert(await story.getByText('此事件的論點變化', { exact: true }).isVisible())
              assert(await story.getByText('此事件的風險', { exact: true }).isVisible())
              await story.getByText('這筆更新的原始提醒', { exact: true }).click()
              assert(await story.getByText('收盤前再看一次量能是否延續，不因單一盤中波動追價。', { exact: true }).isVisible())
              await page.getByRole('tab', { name: '研究與策略', exact: true }).click()
              const researchPanelTab = page.getByRole('tab', { name: '研究與策略', exact: true })
              assert.equal(await researchPanelTab.getAttribute('aria-selected'), 'true')
              const researchPanel = page.locator('#investment-panel-research')
              await researchPanel.getByRole('region', { name: '正式 Research' }).waitFor({ state: 'visible' })
              await researchPanel.getByRole('region', { name: 'Watch 來源日期' }).waitFor({ state: 'visible' })
              await researchPanel.getByText('我的待續工作與提醒', { exact: true }).click()
              await researchPanel.getByRole('region', { name: '我的提醒' }).waitFor({ state: 'visible' })
              await page.getByRole('tab', { name: '今日', exact: true }).click()
              await page.getByText('正式簡報基線與論據', { exact: true }).click()
              assert(await page.getByText('星島設備發表新一代儲能產品（虛構）', { exact: true }).isVisible(),
                `${name}: formal brief baseline remains reachable in the story card`)
              const judgmentTab = page.getByRole('tab', { name: '我的判斷', exact: true })
              await judgmentTab.click()
              assert.equal(await judgmentTab.getAttribute('aria-selected'), 'true')
              await page.getByText('來源關聯不一致', { exact: true }).waitFor({ timeout: 5000 })
              assert.equal(await page.locator('#investment-panel-judgment [aria-label="論點近況"]').count(), 0,
                `${name}: daily brief changes remain in Today instead of a duplicate judgment projection`)
              const thesis = page.getByRole('region', { name: '我的論點｜五層證據' })
              assert(await thesis.getByText('來源關聯不一致', { exact: true }).isVisible(),
                `${name}: narrative aggregate drift must remain visible`)
              assert(await thesis.getByText(/合成狀態示例：論點來源關聯互相衝突/).isVisible(),
                `${name}: aggregate state reason must be visible without expanding sources`)
              assert(await thesis.getByText('證據覆蓋：資料部分可用', { exact: true }).isVisible(),
                `${name}: evidence coverage must remain distinct from aggregate narrative state`)
              assert(await thesis.getByText(/合成測試：證據尚未映射到五層/).isVisible())
              const challengeSourceDisclosure = thesis.getByText('訊號日期與來源', { exact: true }).first()
              const challengeSignal = challengeSourceDisclosure.locator('xpath=ancestor::li[1]')
              await challengeSourceDisclosure.click()
              assert(await challengeSignal.getByText(/訊號日期：\s*未提供/).isVisible(),
                `${name}: an unknown signal date must stay unknown`)
              assert(await challengeSignal.getByText(/文件更新日：\s*2026-09-19/).isVisible(),
                `${name}: document update must be separately labelled`)
              assert(await challengeSignal.getByText(/demo\/synthetic-challenge-signal\.md.*第 15 行/).isVisible(),
                `${name}: challenge signal must retain its own source line`)
              await challengeSourceDisclosure.click()
              const historyLink = thesis.getByRole('button', { name: '復盤與學習', exact: true })
              await historyLink.click()
              assert.equal(await page.getByRole('tab', { name: '復盤與學習', exact: true }).getAttribute('aria-selected'), 'true')
              await page.getByRole('heading', { name: '可重用框架', exact: true }).waitFor()
              const linkedHistory = page.locator('[aria-label="已連結的歷史判斷"]')
              assert(await linkedHistory.getByRole('heading', { name: '範例研究 B：判斷、後續結果與心得', exact: true }).isVisible(),
                `${name}: explicit producer chain is readable from the compact index`)
              await linkedHistory.getByText('讀取這筆 producer 明細', { exact: true }).click()
              assert(await linkedHistory.getByText(/歷史 decision ID：.*decision:synthetic-episode-20260901/).isVisible())
              assert(await linkedHistory.getByText(/合成案例：後續觀察未支持原先需求假設/).isVisible())
              assert(await linkedHistory.getByText(/合成心得：把可檢查的需求證據與假設分開記錄/).isVisible())
              assert(await linkedHistory.getByText(/判斷出處：.*synthetic\/history-chain.md.*2/).isVisible())
              assert(await linkedHistory.getByText(/心得出處：.*synthetic\/history-chain.md.*6/).isVisible())
              const history = page.locator('section[aria-label="復盤與學習"]')
              assert(await history.getByText('部分資料可讀', { exact: true }).first().isVisible())
              assert(await history.getByText(/source_cutoff：.*unknown/).isVisible())
              await history.getByText('歷史紀錄與後續結果 · 4 筆', { exact: true }).click()
              const unknownHistory = history.getByRole('heading', { name: '目前判斷與下一步', exact: true }).locator('xpath=ancestor::div[contains(@class, "p-3")][1]')
              assert(await unknownHistory.getByText('後續結果未知', { exact: true }).isVisible(),
                `${name}: unclassified episode outcome remains unknown beside a linked case`)
              assert(await unknownHistory.getByText('learning 分類：未知或未提供', { exact: true }).isVisible(),
                `${name}: classification is never inferred for the other episode`)
              await page.getByRole('tab', { name: '今日', exact: true }).click()
              const marketCard = page.locator('[aria-label="現在盤面與市場資金"]')
              assert.equal(await marketCard.count(), 1, `${name}: context and discovery must share one market card`)
              assert(await page.getByRole('heading', { name: '市場現在怎麼走', exact: true }).isVisible())
              assert.equal(await page.getByRole('heading', { name: '市場資金在哪', exact: true }).count(), 1)
              const twMarket = page.getByRole('tab', { name: '台股', exact: true })
              const usMarket = page.getByRole('tab', { name: '美股', exact: true })
              assert.equal(await twMarket.getAttribute('aria-selected'), 'true')
              const taiwanPulse = page.locator('[aria-label="台股整體盤感"]')
              assert(await taiwanPulse.getByText(/最近可用交易日 2026-09-19 · 收盤／休市狀態未提供/).isVisible(),
                `${name}: unknown exchange status must stay unknown`)
              assert(await taiwanPulse.getByText('漲跌方向待核對', { exact: true }).isVisible(),
                `${name}: unverified direction must have a neutral explicit state`)
              assert(!(await taiwanPulse.innerText()).includes('漲跌 120 點（+0.55%）'),
                `${name}: unverified index changes must not be presented as a directional conclusion`)
              const pulseIntegrityDetails = taiwanPulse.locator('details')
              const pulseIntegrityDisclosure = taiwanPulse.locator('details > summary')
              await pulseIntegrityDisclosure.focus()
              await page.keyboard.press('Space')
              assert(await taiwanPulse.getByText(/要求日期：.*本頁讀取：.*資料產出：/).isVisible(),
                `${name}: secondary clocks stay accessible together`)
              assert(await taiwanPulse.getByText(/TWSE 日結原值：21,880 點；漲跌 120 點/).isVisible(),
                `${name}: source-specific TWSE value must remain inspectable`)
              assert(await taiwanPulse.getByText(/盤後量價原值：21,880 點；漲跌 -120 點/).isVisible(),
                `${name}: conflicting source-specific value must remain inspectable`)
              await page.keyboard.press('Space')
              assert.equal(await pulseIntegrityDetails.getAttribute('open'), null,
                `${name}: disclosure must collapse by keyboard`)
              assert(await page.getByText(/報價時間/).first().isVisible())
              await usMarket.click()
              assert.equal(await usMarket.getAttribute('aria-selected'), 'true')
              assert(await page.getByText(/美股 breadth、成交額與 sector／theme 摘要未提供/).isVisible())
              assert(await page.getByText('目前部分掃描沒有可列標的；不能據此判定整個市場都沒有符合項目。', { exact: true }).isVisible())
              await noOverflow(page, `${name}/US market`)
              await twMarket.focus()
              await page.keyboard.press('ArrowRight')
              assert.equal(await usMarket.getAttribute('aria-selected'), 'true')
              await page.keyboard.press('Home')
              assert.equal(await twMarket.getAttribute('aria-selected'), 'true')
              await noOverflow(page, `${name}/market keyboard`)
              const hero = await page.getByText('今天發生了什麼', { exact: true }).boundingBox()
              assert(hero && hero.y + hero.height < height, `${name}: key judgment must begin in first screen`)
              await page.screenshot({ path: `${output}/${name}.png`, fullPage: true })
              await page.screenshot({ path: `${output}/${name}-first-screen.png` })
              const layout = await noOverflow(page, name)
              for (const label of ['今日', '我的判斷', '研究與策略', '復盤與學習']) {
                const tab = page.getByRole('tab', { name: label, exact: true })
                await tab.click()
                assert.equal(await tab.getAttribute('aria-selected'), 'true')
                await noOverflow(page, `${name}/${label}`)
              }
              const researchTab = page.getByRole('tab', { name: '研究與策略', exact: true })
              await researchTab.click()
              const remindersDisclosure = page.locator('#investment-panel-research > details')
              assert.equal(await remindersDisclosure.evaluate(element => element.open), true,
                `${name}: reminder section stays open after switching tabs`)
              assert(await page.getByRole('heading', { name: '我的提醒', exact: true }).isVisible())
              assert(await researchPanel.getByRole('region', { name: '正式 Research' }).isVisible())
              assert(await researchPanel.getByRole('region', { name: 'Watch 來源日期' }).isVisible())
              await page.getByRole('tab', { name: '今日', exact: true }).click()
              assert.equal(await page.locator('[aria-label="今日個人提醒"]').count(), 0, `${name}: Today reminder section stays removed`)
              assert.equal(await page.locator('#investment-panel-today input[type="date"]').count(), 0, `${name}: Today has no reminder form`)
              const today = page.getByRole('tab', { name: '今日', exact: true })
              await today.focus()
              await page.keyboard.press('ArrowRight')
              assert.equal(await page.getByRole('tab', { name: '我的判斷', exact: true }).getAttribute('aria-selected'), 'true')
              await page.keyboard.press('ArrowRight')
              assert.equal(await page.getByRole('tab', { name: '研究與策略', exact: true }).getAttribute('aria-selected'), 'true')
              await page.keyboard.press('End')
              assert.equal(await page.getByRole('tab', { name: '復盤與學習', exact: true }).getAttribute('aria-selected'), 'true')
              await page.keyboard.press('Home')
              assert.equal(await today.getAttribute('aria-selected'), 'true')
              await page.locator('details').evaluateAll(elements => elements.forEach(el => { if (el.getClientRects().length) el.open = true }))
              await page.getByText('此文字由私人端的情境規格重新生成', { exact: false }).waitFor()
              await page.screenshot({ path: `${output}/${name}-expanded.png`, fullPage: true })
              await noOverflow(page, `${name}/expanded`)
              report.pages.push({ name, ...layout, errors, externalRequests, keyboard: 'passed', sourceDisclosure: 'passed' })
              assert.deepEqual(errors, [], `${name}: no browser runtime errors`)
              assert.deepEqual(externalRequests, [], `${name}: demo must remain network-isolated`)
              await page.close()
            }
            const reminderPage = await browser.newPage({ viewport: { width: 390, height: 844 } })
            const reminderErrors = []
            const reminderExternalRequests = []
            reminderPage.on('pageerror', error => reminderErrors.push(error.message))
            reminderPage.on('request', request => { if (!request.url().startsWith(origin)) reminderExternalRequests.push(request.url()) })
            await reminderPage.goto(`${origin}/?tab=investment`, { waitUntil: 'networkidle' })
            await reminderPage.getByRole('heading', { name: '今天發生了什麼', exact: true }).waitFor()
            const todayPanel = reminderPage.locator('#investment-panel-today')
            assert.equal(await todayPanel.locator('[aria-label="今日個人提醒"]').count(), 0)
            const dates = await reminderPage.evaluate(() => {
              const parts = new Intl.DateTimeFormat('en', { timeZone: 'Asia/Taipei', year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(new Date())
              const part = type => parts.find(item => item.type === type)?.value ?? ''
              const today = `${part('year')}-${part('month')}-${part('day')}`
              const tomorrow = new Date(`${today}T00:00:00Z`)
              tomorrow.setUTCDate(tomorrow.getUTCDate() + 1)
              return { today, tomorrow: tomorrow.toISOString().slice(0, 10) }
            })
            const attentionTab = reminderPage.getByRole('tab', { name: '研究與策略', exact: true })
            await attentionTab.click()
            await attentionTab.waitFor({ state: 'visible' })
            await reminderPage.waitForFunction(() => document.querySelector('#investment-tab-research')?.getAttribute('aria-selected') === 'true')
            const attentionPanel = reminderPage.locator('#investment-panel-research')
            await attentionPanel.waitFor({ state: 'visible' })
            await attentionPanel.getByText('我的待續工作與提醒', { exact: true }).click()
            const addReminderButton = attentionPanel.getByRole('button', { name: '新增提醒', exact: true })
            await addReminderButton.waitFor({ state: 'visible' })
            await addReminderButton.click()
            const reminderInput = attentionPanel.locator('input[aria-label="新增個人提醒"]')
            await reminderInput.waitFor({ state: 'visible' })
            await reminderInput.fill('合成未來個人提醒')
            await attentionPanel.locator('input[aria-label="個人提醒到期日"]').fill(dates.tomorrow)
            await attentionPanel.getByRole('button', { name: '加入提醒', exact: true }).click()
            await attentionPanel.getByText('合成未來個人提醒', { exact: true }).waitFor()
            assert.equal(await todayPanel.getByText('合成未來個人提醒', { exact: true }).count(), 0, 'future reminders stay off Today')
            await attentionPanel.getByRole('button', { name: '加入今日', exact: true }).click()
            await attentionPanel.getByText('已加入今日', { exact: false }).waitFor()
            await reminderPage.getByRole('tab', { name: '今日', exact: true }).click()
            assert.equal(await todayPanel.getByText('合成未來個人提醒', { exact: true }).count(), 0, 'promotion metadata does not restore the Today reminder projection')
            await attentionTab.click()
            await addReminderButton.waitFor({ state: 'visible' })
            await addReminderButton.click()
            await reminderInput.waitFor({ state: 'visible' })
            await reminderInput.fill('合成今日到期提醒')
            await attentionPanel.locator('input[aria-label="個人提醒到期日"]').fill(dates.today)
            await attentionPanel.getByRole('button', { name: '加入提醒', exact: true }).click()
            await attentionPanel.getByText('合成今日到期提醒', { exact: true }).waitFor()
            await reminderPage.getByRole('tab', { name: '今日', exact: true }).click()
            assert.equal(await todayPanel.getByText('合成今日到期提醒', { exact: true }).count(), 0, 'due-today reminder stays in Research & Strategy')
            await attentionTab.click()
            assert(await attentionPanel.getByRole('region', { name: '正式 Research' }).isVisible(), 'formal Research stays distinct')
            assert(await attentionPanel.getByRole('region', { name: 'Watch 來源日期' }).isVisible(), 'source-derived Watch dates stay separate')
            await noOverflow(reminderPage, 'reminders/390px')
            assert.deepEqual(reminderErrors, [], 'reminder interactions must not create browser errors')
            assert.deepEqual(reminderExternalRequests, [], 'reminder interactions stay network-isolated')
            await reminderPage.close()
            // Modify only in-memory synthetic Responses. Do not rewrite generated fixtures,
            // introduce test routes into production, or use any private source material.
            for (const scenario of ['unlinked-long', 'blank-summary', 'missing', 'actions-partial', 'research-only', 'initial-error', 'refresh-error', 'quote-unavailable', 'narrative-stale-partial', 'narrative-delayed', 'market-empty', 'market-unavailable', 'market-cached-unavailable', 'market-initial-error', 'market-refresh-error', 'market-refresh-delayed', 'market-refresh-unavailable', 'market-mixed-dates', 'market-known-breadth-no-ratio', 'session-tw', 'session-stale-us', 'session-missing', 'session-malformed-times', 'watch-read-error', 'watch-eligibility']) {
              const page = await browser.newPage({ viewport: { width: 320, height: 740 } })
              const errors = []
              page.on('pageerror', error => errors.push(error.message))
              await page.addInitScript(scenario => {
                const original = Response.prototype.json
                Response.prototype.json = async function () {
                  const data = await original.call(this)
                  if (scenario === 'watch-read-error' && Object.keys(data ?? {}).length === 1 && Array.isArray(data?.items)) throw new Error('Synthetic reminder read failure')
                  if (scenario === 'watch-eligibility' && Object.keys(data ?? {}).length === 1 && Array.isArray(data?.items)) {
                    const parts = Object.fromEntries(new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Taipei', year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(new Date()).map(part => [part.type, part.value]))
                    const today = `${parts.year}-${parts.month}-${parts.day}`
                    const offsetDate = days => { const date = new Date(`${today}T00:00:00Z`); date.setUTCDate(date.getUTCDate() + days); return date.toISOString().slice(0, 10) }
                    const note = (id, kind, status, expires_on, promoted_to_today = false) => ({ id, kind, status, expires_on, promoted_to_today, text: `Synthetic ${id}`, source_id: '', source_label: '', conclusion: '', version: 1, updated_at: '' })
                    data.items = [
                      note('due-today', 'watch', 'open', today),
                      note('promoted', 'watch', 'open', offsetDate(-1), true),
                      note('future', 'watch', 'open', offsetDate(1)),
                      note('expired', 'watch', 'open', offsetDate(-1)),
                      note('completed', 'watch', 'done', today, true),
                      note('research-event', 'research', 'open', today, true),
                    ]
                  }
                  if (scenario === 'narrative-stale-partial' && data?.narratives?.[0]?.thesis_evidence) {
                    data.narratives[0].state = 'stale'
                    data.narratives[0].state_reason = '合成測試：論點來源較舊；僅示範 aggregate 狀態。'
                    data.narratives[0].thesis_evidence.state = 'partial'
                    data.narratives[0].thesis_evidence.reason = '合成測試：五層證據覆蓋仍不完整。'
                  }
                  if (scenario === 'narrative-delayed' && Array.isArray(data?.narratives)) await new Promise(resolve => setTimeout(resolve, 600))
                  if (data?.brief) {
                    if (scenario === 'initial-error' || window.__failBrief) throw new Error('Synthetic read failure')
                    if (scenario === 'blank-summary') {
                      data.today.updates[0].summary = '   '
                      data.today.updates[0].portfolio_impact = '更正為 2%，原判斷需下修。'
                    }
                    if (scenario === 'unlinked-long') {
                      data.brief.state = 'stale'
                      data.brief.source_cutoff = null
                      data.brief.headline = '合成長標題：' + 'LongUnbrokenEvidence'.repeat(18)
                      data.brief.thesis_changes = [
                        { thesis: '合成未關聯判斷', event_index: null, event_ref: '', change: '轉弱', reason: '缺少新證據，並非維持不變。' },
